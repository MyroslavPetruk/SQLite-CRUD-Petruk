<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Додати студента</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; }
        input[type="text"], input[type="number"] { width: 300px; padding: 8px; box-sizing: border-box; }
        button { padding: 8px 16px; background-color: #28a745; color: white; border: none; cursor: pointer; border-radius: 4px; }
        a { margin-left: 10px; color: #555; text-decoration: none; }
    </style>
</head>
<body>
    <h2>Додати нового студента</h2>
    <form method="POST">
        <div class="form-group">
            <label for="first_name">Ім'я:</label>
            <input type="text" id="first_name" name="first_name" required>
        </div>
        <div class="form-group">
            <label for="last_name">Прізвище:</label>
            <input type="text" id="last_name" name="last_name" required>
        </div>
        <div class="form-group">
            <label for="student_group">Група:</label>
            <input type="text" id="student_group" name="student_group" required>
        </div>
        <div class="form-group">
            <label for="gpa">Середній бал (GPA):</label>
            <input type="number" step="0.1" id="gpa" name="gpa" required>
        </div>
        <button type="submit">Зберегти</button>
        <a href="/">Скасувати</a>
    </form>
</body>
</html>
